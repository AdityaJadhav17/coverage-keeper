reason = "minimatch ReDoS (moderate). Dev-only: ESLint plugins (minimatch 3.x) and license-checker. Not in the production bundle; patterns come from our own config, not user input. Fix needs minimatch 11, which breaks the ESLint 9 plugins. Re-check when eslint-config-next moves off minimatch 3."

