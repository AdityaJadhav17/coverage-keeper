# Read by osv-scanner in CI (ci.yml audit job, security.yml). Each exception needs a reason
# and an expiry so the nightly audit fails again and the finding gets re-checked.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
